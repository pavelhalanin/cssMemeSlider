<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cssMemeSliders</title>
    <meta name="description" content="RS School 2026 Q2 Stage0.5 CSS meme slider">
    <meta name="keywords" content="RS School 2026 Q2 Stage0.5 CSS meme slider">
    <link rel="stylesheet" href="./styles.css">
</head>

<body>

    <div class="slider__wrapper">
        <input id="slide1" type="radio" name="slider" value="1" checked>
        <input id="slide2" type="radio" name="slider" value="2">
        <input id="slide3" type="radio" name="slider" value="3">
        <input id="slide4" type="radio" name="slider" value="4">

        <div class="slider__images">
            <div class="slider__image_block"></div>
            <div class="slider__image_block"></div>
            <div class="slider__image_block"></div>
            <div class="slider__image_block"></div>
        </div>

        <div class="slider__labels">
            <label for="slide1"></label>
            <label for="slide2"></label>
            <label for="slide3"></label>
            <label for="slide4"></label>
        </div>
    </div>

</body>

</html>
